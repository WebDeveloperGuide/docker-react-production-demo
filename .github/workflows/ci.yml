name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests and generate coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  e2e-tests:
    name: Production container E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start the production container
        run: docker compose -f docker-compose.yml up --build -d

      - name: Wait for the container health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              echo "Container health endpoint returned HTTP 200."
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml logs app
          exit 1

      - name: Run Playwright against the production container
        run: npm run test:e2e:external
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the production container
        if: always()
        run: docker compose -f docker-compose.yml down

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci-success:
    name: Required CI checks
    if: always()
    needs: [code-quality, unit-tests, build, e2e-tests, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every mandatory job passed
        env:
          CODE_QUALITY: ${{ needs.code-quality.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BUILD: ${{ needs.build.result }}
          E2E_TESTS: ${{ needs.e2e-tests.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          if [[ "$CODE_QUALITY" != "success" ||
                "$UNIT_TESTS" != "success" ||
                "$BUILD" != "success" ||
                "$E2E_TESTS" != "success" ||
                "$SECURITY" != "success" ]]; then
            echo "::error::At least one required CI job did not pass."
            exit 1
          fi
