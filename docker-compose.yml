services:
  app:
    image: docker-react-production-demo:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-local}
        GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:-https://github.com/}
    container_name: docker-react-production-demo
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
